[package]
# crates.io 公開名（イシュー #877/#879・#878 でユーザー承認済み。
# `docs/crates-io-naming-decision.md`）。ディレクトリ名 `crates/autodiff`
# は変更しない。lib 名は Rust 識別子化された `fandhe_ai_autodiff`。
name = "fandhe-ai-autodiff"
# crates.io 公開向け説明文（英語。イシュー #880）。内部向け旧説明:
# 「動的テープ式自動微分（REQ-1）」
description = "From-scratch dynamic-tape automatic differentiation for a Rust AI/ML library"
version.workspace = true
edition.workspace = true
license.workspace = true
# crates.io 公開メタデータ（#880）。`workspace.package.repository`（ルート
# Cargo.toml）を参照する。
repository.workspace = true
# crates.io の本クレートページに表示される readme（イシュー #882）。
# 「fandhe-ai 経由での利用が唯一のサポート面・本クレートへの直接依存は
# サポート対象外」を明示する per-crate 方式を採用（`crates/facade/Cargo.toml`
# の同コメント参照）。
readme = "README.md"
# crates.io 公開対象 6 クレートの 1 つ（#881・docs/crates-io-publishing-order.md
# §6）。ルート `[workspace.package]` の `publish = false`（docs-site 等の非公開
# クレート向け既定）を明示的に上書きし、本クレートを公開可能にする。
publish = true
# crates.io 検索・カテゴリページ向けメタデータ（#880）。keywords / categories の
# 制約・出典は `crates/facade/Cargo.toml` の同コメント参照。
keywords = ["autograd", "backpropagation", "machine-learning", "deep-learning"]
categories = ["science", "mathematics"]

[dependencies]
# `Tensor<f32>`（非追跡）を Var の値表現・演算入出力として直接利用する
# workspace 内 path 依存。deps-policy.md の許容依存 8 区分の対象外
# （外部クレートではなく workspace member 間の依存のためユーザー承認
# フローの対象にならない。TASK-1.5a・#16）。
# `version` 併記（crates.io 公開対象 6 クレート間の path 依存。
# イシュー #881 で確定した方針。`docs/crates-io-publishing-order.md`）:
# `cargo package`／
# `cargo publish` は `[dependencies]`（`dev-dependencies` を除く）の
# path 依存に crates.io 解決可能な `version` がないと公開パッケージを
# 生成できないため、workspace 公開バージョン（`Cargo.toml` の
# `[workspace.package].version`）と完全一致させて明記する。非公開
# クレート（`bench-harness` 等。`publish.workspace = true` が現状
# `false` を継承）への path 依存には付与しない（存在しない crates.io
# パッケージを指すことになるため）。
fandhe-ai-tensor-core = { path = "../tensor-core", version = "=0.8.0" }

[dev-dependencies]
# PoC-v2-2 突合テスト（`tests/poc_v2_2_parity.rs`・TASK-1.5d・#19）が
# 決定的シード生成（`Xorshift64Star`）に使う。workspace 内 path 依存
# であり、上記 tensor-core 依存と同じ整理（外部クレートではなく
# workspace member 間の依存のためユーザー承認フローの対象にならない）。
bench-harness = { path = "../bench-harness" }
# AdamW 参照値 JSON（`tests/fixtures/adamw-pytorch-reference/
# adamw_reference.json`・#194）の読込に使う。`serde`/`serde_json` は
# workspace で固定済みの許容依存（deps-policy.md）であり、参照するのみ
# で新規外部依存の追加ではない（`onnx-interop`（#73）・`bench-harness`
# （#29）が行った同種の判断の先例）。
serde.workspace = true
serde_json.workspace = true

# view 系ノード（reshape / transpose。イシュー #1047）の「forward・
# backward でバッファ確保が 0」という受け入れ条件を
# `bench_harness::alloc_tracker::TrackingAllocator`（`#[global_allocator]`
# フック）で機械的に実測する専用テストターゲット。同トラッカーはプロセス
# 全体で共有される静的カウンタを持つため、libtest 既定の並列実行下では
# 他テストの確保・解放が干渉する（`crates/bench-harness/src/
# alloc_tracker.rs` モジュール冒頭「テストでの計測検証（プロセス分離）」
# 節）。`crates/bench-harness/tests/alloc_tracker_serial.rs`（`[[test]]
# harness = false`）と同じ対処方針を採用し、本クレートでも専用の
# 単一スレッド・単一プロセスバイナリへ分離する。
[[test]]
name = "view_zero_alloc"
path = "tests/view_zero_alloc.rs"
harness = false

# activation checkpointing（イシュー #1624）の「forward+backward の
# ピークメモリが非 checkpoint より小さい」という受け入れ条件を、上記と
# 同じ `TrackingAllocator` プロセス分離方式で実測する専用テスト
# ターゲット。
[[test]]
name = "checkpoint_peak_memory"
path = "tests/checkpoint_peak_memory.rs"
harness = false
